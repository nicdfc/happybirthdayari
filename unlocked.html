<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unlocked</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07090d;
    --gold: #f2c75c;
    --gold-deep: #a5782a;
    --text: #efe6cf;
    --muted: #8a8170;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 40%, #2a2214 0%, var(--bg) 70%);
    color: var(--text);
    font-family: "Cinzel", Georgia, serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow: hidden;
    text-align: center;
  }
  .wrap {
    width: min(640px, 100%);
    opacity: 0;
    animation: rise 1.4s .2s ease-out forwards;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }

  .badge {
    font-family: "Share Tech Mono", monospace;
    letter-spacing: .35em;
    font-size: 13px;
    color: #39ff88;
    text-shadow: 0 0 8px #39ff88;
    margin-bottom: 28px;
  }
  .key-icon {
    width: 72px; height: 72px;
    margin: 0 auto 26px;
    filter: drop-shadow(0 0 18px rgba(242,199,92,.55));
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float { 50% { transform: translateY(-8px) rotate(-6deg); } }

  .scroll {
    border: 1px solid rgba(242,199,92,.35);
    border-radius: 14px;
    padding: 34px 26px;
    background: linear-gradient(180deg, rgba(242,199,92,.07), rgba(242,199,92,.02));
    box-shadow: 0 20px 60px rgba(0,0,0,.6), inset 0 0 40px rgba(242,199,92,.05);
  }
  .msg {
    font-weight: 600;
    font-size: clamp(22px, 5.2vw, 34px);
    line-height: 1.45;
    color: var(--text);
    min-height: 3em;
    text-shadow: 0 2px 10px rgba(0,0,0,.6);
  }
  .msg .cursor {
    display: inline-block;
    width: .5em;
    border-bottom: 3px solid var(--gold);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .footer {
    margin-top: 26px;
    font-size: 15px;
    letter-spacing: .3em;
    color: var(--gold);
    opacity: 0;
    transition: opacity 1.2s;
  }
  .footer.show { opacity: 1; }

  .locked {
    font-family: "Share Tech Mono", monospace;
    color: #ff5b5b;
    letter-spacing: .15em;
  }
  .locked a { color: var(--gold); }

  .spark {
    position: fixed;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 6px var(--gold);
    pointer-events: none;
    animation: drift linear forwards;
  }
  @keyframes drift {
    from { transform: translateY(0); opacity: 0; }
    10% { opacity: 1; }
    to { transform: translateY(-110vh); opacity: 0; }
  }
</style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="badge">&#9632; LOCK DISENGAGED &#9632;</div>
    <svg class="key-icon" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffe39a"/>
          <stop offset="1" stop-color="#a5782a"/>
        </linearGradient>
      </defs>
      <circle cx="20" cy="20" r="13" fill="none" stroke="url(#g)" stroke-width="6"/>
      <path d="M29 29 L56 56 M44 44 L50 38 M50 50 L56 44" stroke="url(#g)" stroke-width="6" stroke-linecap="round"/>
    </svg>
    <div class="scroll">
      <div class="msg" id="msg"></div>
    </div>
    <div class="footer" id="footer">HAPPY 13TH BIRTHDAY, ARI</div>
  </div>

<script src="lock.js"></script>
<script>
  let code = null;
  try { code = sessionStorage.getItem("lockbox-code"); } catch (e) {}
  if (!code && location.hash) code = location.hash.slice(1);
  // Keep the code out of the address bar.
  if (location.hash) history.replaceState(null, "", location.pathname);

  const text = code ? tryUnlock(code) : null;
  const msg = document.getElementById("msg");

  if (!text) {
    msg.innerHTML = '<div class="locked">NICE TRY.<br>THIS BOX IS STILL LOCKED.<br><br><a href="index.html">&larr; Back to the keypad</a></div>';
    document.querySelector(".badge").textContent = "■ ACCESS DENIED ■";
    document.querySelector(".badge").style.color = "#ff5b5b";
    document.querySelector(".badge").style.textShadow = "0 0 8px #ff5b5b";
    document.querySelector(".key-icon").style.display = "none";
  } else {
    let i = 0;
    const cursor = '<span class="cursor"></span>';
    setTimeout(function type() {
      i++;
      msg.innerHTML = escapeHtml(text.slice(0, i)) + cursor;
      if (i < text.length) {
        const ch = text[i - 1];
        setTimeout(type, ch === "," ? 380 : 55);
      } else {
        setTimeout(() => {
          msg.innerHTML = escapeHtml(text);
          document.getElementById("footer").classList.add("show");
        }, 1200);
      }
    }, 1200);

    // Floating golden sparks.
    setInterval(() => {
      const s = document.createElement("div");
      s.className = "spark";
      s.style.left = Math.random() * 100 + "vw";
      s.style.top = "100vh";
      s.style.animationDuration = 5 + Math.random() * 6 + "s";
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 11000);
    }, 260);
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }
</script>
</body>
</html>
