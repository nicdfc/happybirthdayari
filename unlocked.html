<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unlocked</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07090d;
    --gold: #f2c75c;
    --gold-deep: #a5782a;
    --text: #efe6cf;
    --muted: #8a8170;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 40%, #2a2214 0%, var(--bg) 70%);
    color: var(--text);
    font-family: "Cinzel", Georgia, serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow: hidden;
    text-align: center;
  }
  .wrap {
    width: min(640px, 100%);
    opacity: 0;
    animation: rise 1.4s .2s ease-out forwards;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }

  .badge {
    font-family: "Share Tech Mono", monospace;
    letter-spacing: .35em;
    font-size: 13px;
    color: #39ff88;
    text-shadow: 0 0 8px #39ff88;
    margin-bottom: 28px;
  }
  .key-icon {
    width: 72px; height: 72px;
    margin: 0 auto 26px;
    filter: drop-shadow(0 0 18px rgba(242,199,92,.55));
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float { 50% { transform: translateY(-8px) rotate(-6deg); } }

  .scroll {
    border: 1px solid rgba(242,199,92,.35);
    border-radius: 14px;
    padding: 34px 26px;
    background: linear-gradient(180deg, rgba(242,199,92,.07), rgba(242,199,92,.02));
    box-shadow: 0 20px 60px rgba(0,0,0,.6), inset 0 0 40px rgba(242,199,92,.05);
  }
  .msg {
    font-weight: 600;
    font-size: clamp(22px, 5.2vw, 34px);
    line-height: 1.45;
    color: var(--text);
    min-height: 3em;
    text-shadow: 0 2px 10px rgba(0,0,0,.6);
  }
  .msg .cursor {
    display: inline-block;
    width: .5em;
    border-bottom: 3px solid var(--gold);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .footer {
    margin-top: 26px;
    font-size: 15px;
    letter-spacing: .3em;
    color: var(--gold);
    opacity: 0;
    transition: opacity 1.2s;
  }
  .footer.show { opacity: 1; }

  .back {
    display: inline-block;
    margin-top: 34px;
    padding: 12px 22px;
    border-radius: 999px;
    border: 1px solid rgba(242,199,92,.45);
    background: rgba(242,199,92,.08);
    color: var(--gold);
    font-family: "Share Tech Mono", monospace;
    font-size: 14px;
    letter-spacing: .2em;
    text-decoration: none;
    transition: background .2s, box-shadow .2s;
  }
  .back:hover, .back:focus-visible {
    background: rgba(242,199,92,.18);
    box-shadow: 0 0 16px rgba(242,199,92,.35);
    outline: none;
  }

  .locked {
    font-family: "Share Tech Mono", monospace;
    color: #ff5b5b;
    letter-spacing: .15em;
  }
  .locked a { color: var(--gold); }

  .spark {
    position: fixed;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 6px var(--gold);
    pointer-events: none;
    animation: drift linear forwards;
  }
  @keyframes drift {
    from { transform: translateY(0); opacity: 0; }
    10% { opacity: 1; }
    to { transform: translateY(-110vh); opacity: 0; }
  }

  /* waving alien (Mika's page) */
  .alien {
    display: none;
    width: 190px;
    height: 210px;
    margin: -10px auto 18px;
    overflow: visible;
    filter: drop-shadow(0 0 22px rgba(120,255,110,.35));
    animation: hover 2.6s ease-in-out infinite;
  }
  .alien.show { display: block; }
  @keyframes hover { 50% { transform: translateY(-10px); } }
  .alien .wave {
    transform-origin: 142px 150px;
    animation: wave .9s ease-in-out infinite alternate;
  }
  @keyframes wave { from { transform: rotate(-18deg); } to { transform: rotate(22deg); } }
  .alien .eyes {
    transform-origin: 100px 84px;
    animation: alien-blink 4s infinite;
  }
  @keyframes alien-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .alien .antenna-l { transform-origin: 78px 40px; animation: wobble 1.3s ease-in-out infinite alternate; }
  .alien .antenna-r { transform-origin: 122px 40px; animation: wobble 1.3s .3s ease-in-out infinite alternate-reverse; }
  @keyframes wobble { from { transform: rotate(-10deg); } to { transform: rotate(10deg); } }
  .alien .glow { animation: glow 1.2s ease-in-out infinite alternate; }
  @keyframes glow { to { fill: #fff59a; } }
</style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="badge">&#9632; LOCK DISENGAGED &#9632;</div>
    <svg class="key-icon" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffe39a"/>
          <stop offset="1" stop-color="#a5782a"/>
        </linearGradient>
      </defs>
      <circle cx="20" cy="20" r="13" fill="none" stroke="url(#g)" stroke-width="6"/>
      <path d="M29 29 L56 56 M44 44 L50 38 M50 50 L56 44" stroke="url(#g)" stroke-width="6" stroke-linecap="round"/>
    </svg>
    <svg class="alien" id="alien" viewBox="0 0 200 220" aria-label="A green alien waving hello">
      <defs>
        <radialGradient id="skin" cx="40%" cy="35%" r="70%">
          <stop offset="0" stop-color="#b6ff8f"/>
          <stop offset=".6" stop-color="#5fe05a"/>
          <stop offset="1" stop-color="#2a9b3c"/>
        </radialGradient>
        <radialGradient id="eye" cx="35%" cy="30%" r="80%">
          <stop offset="0" stop-color="#2b2140"/>
          <stop offset="1" stop-color="#05030b"/>
        </radialGradient>
      </defs>
      <!-- antennae -->
      <g class="antenna-l">
        <path d="M80 42 Q70 18 60 10" stroke="#3fbf4a" stroke-width="5" fill="none" stroke-linecap="round"/>
        <circle class="glow" cx="59" cy="9" r="8" fill="#ffd94a"/>
      </g>
      <g class="antenna-r">
        <path d="M120 42 Q130 18 140 10" stroke="#3fbf4a" stroke-width="5" fill="none" stroke-linecap="round"/>
        <circle class="glow" cx="141" cy="9" r="8" fill="#ffd94a"/>
      </g>
      <!-- resting arm -->
      <path d="M62 150 Q40 168 44 190" stroke="#4fd055" stroke-width="13" fill="none" stroke-linecap="round"/>
      <circle cx="44" cy="192" r="9" fill="#5fe05a"/>
      <!-- body -->
      <path d="M58 140 Q100 122 142 140 Q156 185 138 208 Q100 220 62 208 Q44 185 58 140 Z" fill="url(#skin)"/>
      <ellipse cx="100" cy="180" rx="24" ry="20" fill="#9cf58a" opacity=".7"/>
      <circle cx="100" cy="176" r="4" fill="#2a9b3c" opacity=".6"/>
      <!-- legs -->
      <ellipse cx="80" cy="212" rx="14" ry="7" fill="#3fbf4a"/>
      <ellipse cx="120" cy="212" rx="14" ry="7" fill="#3fbf4a"/>
      <!-- waving arm -->
      <g class="wave">
        <path d="M140 150 Q165 135 172 102" stroke="#4fd055" stroke-width="13" fill="none" stroke-linecap="round"/>
        <g fill="#5fe05a">
          <circle cx="173" cy="96" r="11"/>
          <rect x="162" y="72" width="7" height="20" rx="3.5" transform="rotate(-18 165 82)"/>
          <rect x="171" y="68" width="7" height="22" rx="3.5"/>
          <rect x="180" y="72" width="7" height="20" rx="3.5" transform="rotate(18 183 82)"/>
        </g>
      </g>
      <!-- head -->
      <ellipse cx="100" cy="86" rx="64" ry="54" fill="url(#skin)"/>
      <ellipse cx="78" cy="56" rx="18" ry="9" fill="#fff" opacity=".25" transform="rotate(-20 78 56)"/>
      <!-- eyes -->
      <g class="eyes">
        <ellipse cx="74" cy="84" rx="20" ry="25" fill="url(#eye)" transform="rotate(-18 74 84)"/>
        <ellipse cx="126" cy="84" rx="20" ry="25" fill="url(#eye)" transform="rotate(18 126 84)"/>
        <circle cx="67" cy="74" r="7" fill="#fff"/>
        <circle cx="119" cy="74" r="7" fill="#fff"/>
        <circle cx="78" cy="92" r="3" fill="#fff" opacity=".8"/>
        <circle cx="130" cy="92" r="3" fill="#fff" opacity=".8"/>
      </g>
      <!-- cheeks and smile -->
      <ellipse cx="54" cy="110" rx="9" ry="5" fill="#ff7fa8" opacity=".55"/>
      <ellipse cx="146" cy="110" rx="9" ry="5" fill="#ff7fa8" opacity=".55"/>
      <path d="M82 114 Q100 132 118 114 Q100 122 82 114 Z" fill="#1d4d22"/>
      <path d="M93 121 Q100 128 107 121 Q100 124 93 121 Z" fill="#ff7fa8"/>
    </svg>
    <div class="scroll">
      <div class="msg" id="msg"></div>
    </div>
    <div class="footer" id="footer"></div>
    <a class="back" id="back" href="index.html">&larr; BACK TO LOCKBOX</a>
  </div>

<script src="lock.js"></script>
<script>
  let code = null;
  try { code = sessionStorage.getItem("lockbox-code"); } catch (e) {}
  if (!code && location.hash) code = location.hash.slice(1);
  // Keep the code out of the address bar.
  if (location.hash) history.replaceState(null, "", location.pathname);

  const secret = code ? tryUnlock(code) : null;
  const text = secret && secret.msg;
  if (secret && secret.alien) {
    document.querySelector(".key-icon").style.display = "none";
    document.getElementById("alien").classList.add("show");
  }
  document.getElementById("footer").textContent = (secret && secret.footer) || "";

  // Going back re-locks the box.
  document.getElementById("back").addEventListener("click", () => {
    try { sessionStorage.removeItem("lockbox-code"); } catch (e) {}
  });
  const msg = document.getElementById("msg");

  if (!text) {
    msg.innerHTML = '<div class="locked">NICE TRY.<br>THIS BOX IS STILL LOCKED.</div>';
    document.querySelector(".badge").textContent = "■ ACCESS DENIED ■";
    document.querySelector(".badge").style.color = "#ff5b5b";
    document.querySelector(".badge").style.textShadow = "0 0 8px #ff5b5b";
    document.querySelector(".key-icon").style.display = "none";
  } else {
    let i = 0;
    const cursor = '<span class="cursor"></span>';
    setTimeout(function type() {
      i++;
      msg.innerHTML = escapeHtml(text.slice(0, i)) + cursor;
      if (i < text.length) {
        const ch = text[i - 1];
        setTimeout(type, ch === "," ? 380 : 55);
      } else {
        setTimeout(() => {
          msg.innerHTML = escapeHtml(text);
          document.getElementById("footer").classList.add("show");
        }, 1200);
      }
    }, 1200);

    // Floating golden sparks.
    setInterval(() => {
      const s = document.createElement("div");
      s.className = "spark";
      s.style.left = Math.random() * 100 + "vw";
      s.style.top = "100vh";
      s.style.animationDuration = 5 + Math.random() * 6 + "s";
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 11000);
    }, 260);
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }
</script>
</body>
</html>
